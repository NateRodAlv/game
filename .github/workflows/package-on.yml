name: Package Python Project

on:
  push:
    branches: [ main ]

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change to your preferred version

    # 3. Install the standard PyPA building tool
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    # 4. Compile the source and binary wheels into the dist/ directory
    - name: Build package
      run: python -m build

    # 5. Save the generated files as a downloadable GitHub artifact
    - name: Upload packaged artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-package-dist
        path: dist/
