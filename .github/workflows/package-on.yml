name: Build and Deploy Web Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Needed for the official GitHub Pages deploy actions below
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deploys racing each other
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pygbag compiles Pygame (Pygame-CE included) to WebAssembly so it
      # runs in the browser - this replaces PyInstaller entirely, since
      # PyInstaller only ever produces a native .exe, not a web build.
      - name: Install pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag

      # Builds a static web bundle into build/web/. --build skips
      # pygbag's local dev server since we just want the output files.
      # Change 'main.py' if your game's entry script has a different name.
      - name: Build web export
        run: |
          python -m pygbag --build main.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4