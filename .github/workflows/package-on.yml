name: Build Pygame Executable

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Install Pygame and PyInstaller
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pygame-ce pyinstaller

    # 4. Run PyInstaller to bundle your game into a single .exe
    # Note: Change 'main.py' to your game's starting script name
    - name: Run PyInstaller
      run: |
        pyinstaller --onefile --noconsole main.py

    # 5. Save the generated .exe as a downloadable artifact
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: pygame-windows-exe
        path: dist/*.exe
