name: Build Pygame Executable

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pygame-ce pyinstaller numpy

    - name: Run PyInstaller
      run: pyinstaller --onefile --noconsole main.py --add-data "memorymap.json;." --add-data "rooms;rooms" --add-data "assets;assets"

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: pygame-windows-exe
        path: dist/*.exe